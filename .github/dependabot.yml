version: 2

updates:
  # npm dependencies — weekly scan
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    reviewers:
      - "AbhishekKalyan07"
    labels:
      - "security"
      - "dependencies"
    # Group all non-breaking patch/minor updates into a single PR
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major framework/runtime bumps break automated CI and require manual migration
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # Major vitest / tooling bumps break peer dependencies unless migrated manually
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "puppeteer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jspdf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jspdf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jspdf-autotable"
        update-types: ["version-update:semver-major"]
      # These require manual review due to breaking changes:
      # react-router 7.12+ has CSRF vulnerability but downgrade is breaking.
      # uuid 11+ breaks exceljs compatibility. Document and accept risk.
      - dependency-name: "react-router-dom"
        versions: [">=7.12.0"]
      - dependency-name: "exceljs"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keep action versions updated with non-breaking patches/minors
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
