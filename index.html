<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#4A235A" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Mysuru Paakashale — home-style breakfast, lunch and dinner subscriptions, delivered daily to your door." />
    <meta name="color-scheme" content="light" />

    <!-- Web App & iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paakashale" />

    <!-- Fonts: Outfit (display), Inter (UI/body), JetBrains Mono (tabular/data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>Mysuru Paakashale — Subscription Kitchen</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-shell {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #f9fafb;
          font-family: 'Outfit', system-ui, sans-serif;
        }
        .initial-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(74, 35, 90, 0.15);
          border-left-color: #4A235A;
          border-radius: 50%;
          animation: initial-spin 1s linear infinite;
          margin-bottom: 24px;
        }
        .initial-brand {
          color: #4A235A;
          font-size: 1.5rem;
          font-weight: 600;
          letter-spacing: -0.025em;
        }
        @keyframes initial-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-shell">
        <div class="initial-spinner"></div>
        <div class="initial-brand">Mysuru Paakashale</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
