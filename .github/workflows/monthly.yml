name: Monthly Automation Tasks

on:
  schedule:
    # 18:30 UTC is 00:00 IST. We run on the 28th-31st and conditionally execute if tomorrow is the 1st.
    - cron: '30 18 28-31 * *'
  workflow_dispatch:

jobs:
  run-monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Check if last day of the month
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u -d 'tomorrow' +%d)" != "01" ]; then
            echo "Not the last day of the month. Exiting."
            exit 0
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Monthly Automation
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_APPCHECK_DEBUG_TOKEN }}
          VITE_AUTOMATION_EMAIL: ${{ secrets.VITE_AUTOMATION_EMAIL }}
          VITE_AUTOMATION_PASSWORD: ${{ secrets.VITE_AUTOMATION_PASSWORD }}
        run: npx vite-node --config vite.config.ts scripts/automation/monthly.ts
