<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#3A4D23" />
    <meta name="description" content="Mysuru Paakashale — home-style breakfast, lunch and dinner subscriptions, delivered daily to your door." />
    <meta name="color-scheme" content="light" />

    <!-- Fonts: Outfit (display), Inter (UI/body), JetBrains Mono (tabular/data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>Mysuru Paakashale — Subscription Kitchen</title>
  </head>
  <body>
    <div id="root">
      <!-- Animated Launch Splash Screen (replaced seamlessly when React hydrates) -->
      <style>
        .pwa-splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #FDF7F0;
          color: #2C150C;
          font-family: 'Outfit', 'Inter', system-ui, sans-serif;
          overflow: hidden;
        }
        .pwa-splash-ring {
          position: absolute;
          width: 210px;
          height: 210px;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: #D4AF37;
          border-right-color: rgba(212, 175, 55, 0.4);
          border-bottom-color: #B37D14;
          border-left-color: rgba(212, 175, 55, 0.15);
          box-shadow: 0 0 20px rgba(212, 175, 55, 0.2), inset 0 0 10px rgba(212, 175, 55, 0.1);
          animation: spinRing 4s linear infinite;
          will-change: transform;
          transform: translateZ(0);
        }
        .pwa-splash-logo-box {
          position: relative;
          width: 120px;
          height: 120px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #FFFFFF;
          border: 1px solid rgba(212, 175, 55, 0.35);
          border-radius: 50%;
          box-shadow: 0 12px 30px rgba(44, 21, 12, 0.12);
          animation: pulseBox 2s ease-in-out infinite alternate;
        }
        .pwa-splash-logo {
          width: 105px;
          height: 105px;
          object-fit: contain;
          border-radius: 50%;
        }
        .pwa-splash-title {
          margin-top: 24px;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #2C150C;
        }
        .pwa-splash-subtitle {
          margin-top: 6px;
          font-size: 12px;
          color: #8C5A18;
          font-weight: 600;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }
        .pwa-splash-bar-bg {
          margin-top: 36px;
          width: 140px;
          height: 4px;
          background: rgba(44, 21, 12, 0.1);
          border-radius: 99px;
          overflow: hidden;
          position: relative;
        }
        .pwa-splash-bar-fill {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 50%;
          background: linear-gradient(90deg, #D4AF37 0%, #E5A93C 100%);
          border-radius: 99px;
          animation: loadingBar 1.5s ease-in-out infinite;
        }
        @keyframes spinRing {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulseBox {
          0% { transform: scale(0.96); box-shadow: 0 6px 18px rgba(44, 21, 12, 0.08); }
          100% { transform: scale(1.04); box-shadow: 0 16px 36px rgba(212, 175, 55, 0.25); }
        }
        @keyframes loadingBar {
          0% { left: -50%; width: 30%; }
          50% { left: 35%; width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
      <div class="pwa-splash">
        <div class="pwa-splash-ring"></div>
        <div class="pwa-splash-logo-box">
          <img src="/pwa_gold.png" alt="Mysuru Paakashale Logo" class="pwa-splash-logo" />
        </div>
        <div class="pwa-splash-title">Mysuru Paakashale</div>
        <div class="pwa-splash-subtitle">Fresh & Homemade · Subscriptions</div>
        <div class="pwa-splash-bar-bg">
          <div class="pwa-splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
