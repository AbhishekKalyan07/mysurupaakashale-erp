name: Monthly Automation Tasks

on:
  schedule:
    # 18:35 UTC is 00:05 IST on 1st. We run on the 28th-31st and conditionally execute if tomorrow is the 1st in UTC.
    - cron: '35 18 28-31 * *'
  workflow_dispatch:
    inputs:
      target_month:
        description: 'Target month in YYYY-MM format (e.g. 2026-08). Leave blank for previous completed month.'
        required: false
        type: string

jobs:
  check-schedule:
    name: Check Execution Trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Verify end of month or manual dispatch
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Execution triggered manually via workflow_dispatch. Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$(date -u -d 'tomorrow' +%d)" = "01" ]; then
            echo "Month-end reached (18:30 UTC = 00:00 IST on 1st of next month). Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Not the last day of the month in UTC. Skipping scheduled run."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  run-monthly:
    name: Execute Monthly Maintenance
    runs-on: ubuntu-latest
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Monthly Automation
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_MONTH: ${{ inputs.target_month }}
        run: npx vite-node --config vite.config.ts scripts/automation/monthly.ts

      - name: Upload Monthly Reports and Backups
        uses: actions/upload-artifact@v4
        with:
          name: monthly-maintenance-${{ github.run_id }}
          path: |
            backup/
            reports/
          if-no-files-found: warn
          retention-days: 90

