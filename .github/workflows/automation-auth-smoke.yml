name: Automation Auth Smoke Test

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running smoke test'
        required: false
        default: 'Verify FIREBASE_AUTOMATION_API_KEY authentication'

permissions:
  contents: read

concurrency:
  group: automation-auth-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Verify Automation Authentication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Auth Smoke Test
        env:
          FIREBASE_AUTOMATION_API_KEY: ${{ secrets.FIREBASE_AUTOMATION_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npx vite-node --config vite.config.ts scripts/automation/smokeTestAuth.ts
